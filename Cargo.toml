[package]
name = "kruboffice"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "KrubOffice for the desktop: one app that opens documents, spreadsheets and presentations in KhianKrub, KhitKrub or PhutKrub"
publish = false

[[bin]]
name = "kruboffice"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
serde_json = "1"
log = "0.4"
rfd = "0.17"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = "=0.1.0"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
